
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Travel Selection</title>
</head>
<body>

    <h1>Choose Your Travel Destination</h1>

    <form>
        <label for="country">Select Country:</label>
        <select id="country" name="country">
            <option value="india" selected>India</option>
            <option value="japan">Japan</option>
            <option value="france">France</option>
        </select>

        <br><br>

        <label for="state">Select State:</label>
        <select id="state" name="state">
            <option value="uttar-pradesh" selected>Uttar Pradesh</option>
            <option value="rajasthan">Rajasthan</option>
            <option value="himachal-pradesh">Himachal Pradesh</option>
        </select>

        <br><br>

        <label for="city">Select City:</label>
        <select id="city" name="city">
            <option value="mathura" selected>Mathura</option>
            <option value="agra">Agra</option>
            <option value="jaipur">Jaipur</option>
        </select>

        <br><br>

        <label for="place">Favorite Tourist Place:</label>
        <select id="place" name="place">
            <option value="prem-mandir" selected>Prem Mandir</option>
            <option value="taj-mahal">Taj Mahal</option>
            <option value="hawa-mahal">Hawa Mahal</option>
        </select>

    </form>

    <h2>Your Selected Destination</h2>

    <p>
        Country: India<br>
        State: Uttar Pradesh<br>
        City: Mathura<br>
        Favorite Tourist Place: Prem Mandir
    </p>

</body>
</html>
