
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Report Card</title>
</head>
<body>

    <h1 title="Name of the School">ABC Public School</h1>

    <h2>Student Report Card</h2>

    <p><strong>Student Name:</strong> Prachi Singh</p>
    <p><strong>Class:</strong> 12th</p>
    <p><strong>Roll Number:</strong> 101</p>

    <table border="1">
        <thead>
            <tr>
                <th rowspan="2" title="Subject name">Subject</th>
                <th colspan="2" title="Marks obtained and maximum marks">
                    Marks
                </th>
            </tr>
            <tr>
                <th>Obtained</th>
                <th>Maximum</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>English</td>
                <td>85</td>
                <td>100</td>
            </tr>
            <tr>
                <td>Mathematics</td>
                <td>90</td>
                <td>100</td>
            </tr>
            <tr>
                <td>Physics</td>
                <td>82</td>
                <td>100</td>
            </tr>
            <tr>
                <td>Chemistry</td>
                <td>88</td>
                <td>100</td>
            </tr>
            <tr>
                <td>Computer Science</td>
                <td>95</td>
                <td>100</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th colspan="2">Total Marks</th>
                <td>440 / 500</td>
            </tr>
            <tr>
                <th colspan="2">Percentage</th>
                <td>88%</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
