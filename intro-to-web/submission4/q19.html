
<!DOCTYPE html>
<html>
<head>
    <title>Form Security</title>
</head>
<body>
    <h2>Secure Form Example</h2>

    <form autocomplete="off">
        <label>Username:</label>
        <input type="text" name="username" required>
        <br><br>

        <label>Email:</label>
        <input type="email" name="email" required>
        <br><br>

        <label>Password:</label>
        <input type="password" name="password" required>
        <br><br>

        <button type="submit">Submit</button>
    </form>

    <p>Turning off autocomplete can help prevent browsers from automatically
    filling in sensitive information on shared computers. It does not provide
    complete security.</p>
</body>
</html>
