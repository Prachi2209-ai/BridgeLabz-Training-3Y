
<!DOCTYPE html>
<html>
<head>
    <title>HTML Quotations</title>
</head>
<body>
    <h2>Long Quotation</h2>

    <blockquote>
        Learning HTML helps us create webpages. We use &amp; to represent
        the ampersand character in HTML.
    </blockquote>

    <h2>Short Quotation</h2>

    <p>My teacher always says, <q>Practice makes perfect.</q></p>
</body>
</html>
